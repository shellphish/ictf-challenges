name: HillBilly Bank
author: Giovanni Vigna / UCSB Security Lab
category: crypto
description: "**iCTF 2006 — The Hillbilly Bank**\n\nThe Hillbilly Bank is a fictional\
  \ financial institution running an\nRSA-based check signing and verification system.\
  \ It has two components:\n\n- **Branch Bank** (branchbank.py): validates RSA-signed\
  \ checks using a\n  public key. Checks encode recipient, amount, and check number\
  \ in a\n  21-digit string.\n- **Central Bank** (centralbank.py): the issuing authority\
  \ with the\n  private key.\n\nThe bank uses PyCrypto for RSA operations. The vulnerability\
  \ lies in\nthe RSA signing scheme or check validation logic.\n\n*Note: Full service\
  \ binary is in `../../vms/bank2006.tar.gz` (300 MB\nVMware image). The `src/` directory\
  \ contains scoring client scripts.*\n"
