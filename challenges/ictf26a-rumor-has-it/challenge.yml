name: Rumor Has It
author: UCSB Security Lab
category: agentic
description: 'A threat-intel “gossip” is circulating about a security compromise.


  This is an **agentic challenge**: an agent can query an MCP server to:


  - retrieve the first rumor in a gossip chain (`gossip`)

  - query specific sources for their message (`rumor`)

  - submit the ordered chain of sources and the final IoC (`opinion`)


  If the chain and IoC are correct, you get the flag.

  '
