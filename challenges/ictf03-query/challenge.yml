name: query
author: Giovanni Vigna / UCSB Security Lab
category: web
description: "**iCTF 2003 — Windows Goes Open-Source**\n\nquery was a Perl CGI telephone\
  \ directory service. Flags were stored\nas directory entries and retrieved via HTTP\
  \ queries.\n\n## Architecture\n\n- Flag stored as an entry for \"Bill Gates\" with\
  \ flag as the record ID\n- Admin update: `GET /cgi-bin/change.pl?login=admin&password=<pw>&last=Gates&first=Bill&id=<flag>`\n\
  \n## Vulnerability\n\nThe `change.pl` CGI script accepted unsanitized parameters\
  \ in a GET\nrequest. Classic Perl CGI parameter injection or SQL injection likely.\n\
  \n## Vulnerability\n\nThe search CGI (`query_extension.pl`) sanitizes with `s/[^a-zA-Z]//g`,\n\
  stripping non-alpha characters — but `change.pl` accepts admin credentials\nin a\
  \ GET request. The admin password (`##QUERY_DB_PASS##` placeholder)\nis embedded\
  \ in the CGI source. The SQL query uses string interpolation:\n`WHERE last = '$cboname'`\
  \ — sanitized via regex, but `change.pl` may\nnot sanitize its inputs, allowing\
  \ unauthorized flag updates.\n\n## Source\n\nSource extracted from CTF VM (RedHat\
  \ 9 VMware image, `/root/setup/query/`):\n\n- `src/query_extension.pl` — Perl CGI\
  \ phone directory search; connects to\n  PostgreSQL `querydb` as `queryuser`, lists\
  \ all employees or filters by\n  last name; flag is the `id` field of the \"Bill\
  \ Gates\" row\n- `src/change.pl` — admin CGI to update an employee record (last,\
  \ first, id)\n- `src/get_query`, `src/set_query` — scorebot interaction scripts\n\
  - `src/setup.sh`, `src/init_query`, `src/init.sh` — deployment scripts\n"
