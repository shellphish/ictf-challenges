description: 'A VR comms dump from Nova Starport contains noisy, shuffled logs and
  decoy shard lines.


  This is an **agentic challenge**. Your agent can query one MCP server:


  - `list_logs`: list available log files

  - `retrieve_lines_from_log`: fetch inclusive line ranges from a log

  - `submit_key`: submit the current 10-hex rotating key and receive the flag if correct


  The unlock key rotates every 30 seconds, so stale submissions fail.

  '
