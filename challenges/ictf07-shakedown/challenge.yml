name: 'Copyright Mafia: The Shakedown'
author: Giovanni Vigna / UCSB Security Lab
category: web
description: '**iCTF 2007 — The Copyright Mafia**


  The Mafia''s enforcement arm. Bosses register protection rackets over

  Artists; Artists pay revenue to their Boss. Implemented as a **Django**

  web application (Python 2.5, Django 0.96) with two user roles:

  Artist (musician) and Boss (mafia enforcer).


  ## Architecture


  - Django app: `/home/shakedown/public_html/shakedown/` (served via Apache mod_python/mod_wsgi)

  - Static PHP gateway: `/home/shakedown/public_html/artists.php`, `bosses.php` (redirect
  pages)

  - Models: `Artist`, `Boss`, `Protection` (rate + revenue), `News`

  - URL routes: `/artists/*`, `/bosses/*`, `/protections/edit/<id>/`


  ## Flag mechanism


  The flag is stored as a Protection revenue value on a specific Artist.

  The scorebot creates a Boss, creates an Artist with the flag embedded as

  the protection rate or via the `News` entries attached to an artist account.


  ## Vulnerability hints


  - Artist/Boss profile edit: image upload with weak format validation

  - Boss can view Artist "revenue" data — IDOR on artist IDs

  - Django 0.96-era missing CSRF protection — forge POST requests

  - Password hashing scheme may be weak


  ## Source (extracted from Ubuntu VM, mafia2007.vmwarevm snapshot Dec 2007)


  - `src/shakedown/protections/views.pyc` — Python 2.5 bytecode (views)

  - `src/shakedown/protections/models.pyc` — Python 2.5 bytecode (models)

  - `src/shakedown/urls.pyc` — URL routing

  - `src/shakedown/settings.pyc` — Django settings

  - `src/shakedown/templates/*.html` — Django HTML templates (plaintext)

  - `src/artists.php`, `src/bosses.php` — static redirect pages


  Note: Python source (.py) files were GPG-encrypted on the VM;

  only compiled bytecode (.pyc) and HTML templates survive.

  '
