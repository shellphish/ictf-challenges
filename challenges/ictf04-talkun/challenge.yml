name: 'UN Voting: Talkun Note Service'
author: Giovanni Vigna / UCSB Security Lab
category: web
description: '**iCTF 2004 — The UN Voting System**


  A custom C web server (`talkserver`) running on TCP port 8081 with HTTPS on

  8083. The server provides a note-taking web application where users can log

  in and store text notes; the flag is stored as note content.


  ## Source


  Full C source including custom TLS support via OpenSSL:

  - `src/talkserver/talkserver.c` — main HTTP server (handles login, notes, documents)

  - `src/libmydiag/mydiag.c` — diagnostic library

  - `src/libzocket/zocket.c` — socket abstraction library

  - `src/talkserver/talkserver.pem` — SSL certificate

  - `src/untalk.py` — scorebot interaction script

  - `src/talkunScoringScript.py` — scoring script


  The server uses OpenSSL for HTTPS on port 8083. Note files stored as

  plaintext on the filesystem — path traversal in document handling may allow

  reading other users'' notes.

  '
