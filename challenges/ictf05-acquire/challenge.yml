name: 'Spam World: Acquire Relay Tracker'
author: Giovanni Vigna / UCSB Security Lab
category: web
description: '**iCTF 2005 — The Spam Museum: Acquire**


  A PHP web service for acquiring spam samples. Users register, search the spam

  database, and submit leads. Large PHP scripts: `register.php` and `search.php`

  are ~45KB each, suggesting complex database interactions with likely SQL injection.

  An admin panel (`secured/delete.php`, 19KB) provides privileged deletion.

  `get.php` and `set.php` are the direct flag interface. Source code fully available.

  '
