name: Flag submission and verification
author: Giovanni Vigna / UCSB Security Lab
category: infrastructure
description: "iCTF 2010 — Hit 'em Where it Hurts\n\nCentral flag submission server\
  \ for iCTF 2010. Teams captured flags from\nrival services and submitted them here\
  \ via HTTP POST to earn points.\n\nThe service is a multi-threaded Python 2 HTTP\
  \ server (BaseHTTPServer)\nlistening on port 8080. Flags are GPG-encrypted (AES256)\
  \ binary blobs,\nbase64-encoded with a 3-byte prefix stripped before hex-decoding.\
  \ A\nvalid flag decrypts to four newline-separated fields: service name, tick\n\
  number, active status (True/False), and a Unix timestamp. The server\nrejects flags\
  \ older than 5 minutes and deduplucates per (team, service,\ntick) triple. Submitted\
  \ flags are recorded in an SQLite3 database and the\npoint award is forwarded to\
  \ the scorekeeper at\nhttp://scorekeeper/exploit?... using the credential \"getthatflagdude\"\
  .\n\nEndpoints:\n  GET  /            — submission form\n  POST /submission  — submit\
  \ a captured flag\n  GET  /dump?auth=s3cr3t — dump the submissions table (admin)\n\
  \  GET  /style.css, /favicon.ico — static assets\n\nTeams are identified by their\
  \ /24 network prefix via teams.ini.\nPer-service point values are read from services.ini.\n\
  \nThe competition database (database.sqlite3) is included and contains\n799 real\
  \ flag submissions from 40 teams across 7 services over ticks\n62–135.\n"
