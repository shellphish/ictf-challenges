description: '**iCTF 2010 — Hit ''em Where it Hurts**


  LityaHot (S0) was a dating/photo-sharing web service on the fictional

  Lityan network. Running on port 80, it was used by the game''s characters

  (e.g., Femily Edeo) to browse for "hot girls pictures." Teams had to

  find and exploit web vulnerabilities to capture flags from rival instances.


  Source in VM archive: `vms/ictf2010.services.tar.gz` →

  `iCTF2010_service_*` (Ubuntu Server 10.10 32-bit).

