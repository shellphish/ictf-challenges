name: 'Spam World: SpamDB'
author: Giovanni Vigna / UCSB Security Lab
category: web
description: '**iCTF 2005 — The Spam Museum: SpamDB**


  A PHP XML-RPC server (`server.php`) using phpxmlrpc. Exported methods include

  `echotest`, `create_account(email)` → password, and `db_size()`. Flags are

  stored per-account in a flat-file database (via `spamdb.inc`). Vulnerabilities:

  weak/predictable password generation in `gen_passwd()`; PHP warning disclosure

  from `phpwarninggenerator` (undefined `$b`); potential XML injection in the

  2005-era phpxmlrpc library. Source code fully available.

  '
