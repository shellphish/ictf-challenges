description: '**iCTF 2010 — Hit ''em Where it Hurts**


  WeirdTCP (S7) was a service implementing a custom "Litya Internet Protocol"

  on port 3333. Organizers hinted: *"weirdtcp''s important information is in

  the Litya Internet Protocol RFC"* — suggesting a protocol specification

  was published. Teams had to understand the custom protocol and exploit it.


  Source in VM archive: `vms/ictf2010.services.tar.gz`.

  '
